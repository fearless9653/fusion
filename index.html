    <script>
      try {
        var stored = localStorage.getItem('fusion:theme')
        var dark =
          stored === 'dark' ||
          (stored === 'system' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (_) {}
    </script>
